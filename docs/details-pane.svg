<rect x="726.1" y="186.0" width="547.9" height="19" fill="#262626"/>
<text x="726.1" y="200" fill="#949494" textLength="547.9" lengthAdjust="spacingAndGlyphs">Pace projects your average rate since each window opened. Layout:</text>
<text x="18.0" y="219" fill="#ffffff" textLength="8.4" lengthAdjust="spacingAndGlyphs">⏺</text>
<text x="26.4" y="219" fill="#d7dae0" textLength="691.3" lengthAdjust="spacingAndGlyphs"> A prompt cache saves the already-processed start of a prompt, such as the system </text>
<rect x="717.7" y="205.0" width="8.4" height="19" fill="#262626"/>
<text x="717.7" y="219" fill="#d7dae0" opacity="0.6" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<rect x="726.1" y="205.0" width="421.5" height="19" fill="#262626"/>
<text x="726.1" y="219" fill="#949494" textLength="421.5" lengthAdjust="spacingAndGlyphs">model,context,five_hour,seven_day,spend,cache,git.</text>
<text x="18.0" y="238" fill="#d7dae0" textLength="699.7" lengthAdjust="spacingAndGlyphs">  prompt, tools or earlier conversation, so later requests that begin with the same</text>
<rect x="717.7" y="224.0" width="8.4" height="19" fill="#262626"/>
<text x="717.7" y="238" fill="#d7dae0" opacity="0.6" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="18.0" y="257" fill="#d7dae0" textLength="699.7" lengthAdjust="spacingAndGlyphs">  text can reuse it. That makes those requests faster and cheaper, because the     </text>
<rect x="717.7" y="243.0" width="8.4" height="19" fill="#262626"/>
<text x="717.7" y="257" fill="#d7dae0" opacity="0.6" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
