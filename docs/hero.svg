<text x="18.0" y="124" fill="#d7dae0" textLength="969.4" lengthAdjust="spacingAndGlyphs">  Sonnet 5.5 is here, and it&#x27;s faster and excels at well-scoped tasks. Opus 5.5 is still your default. Switch with </text>
