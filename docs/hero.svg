<text x="34.9" y="181" fill="#ffffff" textLength="354.1" lengthAdjust="spacingAndGlyphs">In one sentence: what does cart.js export?</text>
<text x="34.9" y="219" fill="#949494" textLength="42.1" lengthAdjust="spacingAndGlyphs">Read </text>
<text x="77.0" y="219" fill="#949494" font-weight="700" textLength="8.4" lengthAdjust="spacingAndGlyphs">1</text>
<text x="85.4" y="219" fill="#949494" textLength="50.6" lengthAdjust="spacingAndGlyphs"> file </text>
<text x="18.0" y="257" fill="#ffffff" textLength="8.4" lengthAdjust="spacingAndGlyphs">⏺</text>
<text x="34.9" y="257" fill="#afd7ff" textLength="59.0" lengthAdjust="spacingAndGlyphs">cart.js</text>
<text x="93.9" y="257" fill="#d7dae0" textLength="311.9" lengthAdjust="spacingAndGlyphs"> exports one thing, a named function </text>
<text x="405.8" y="257" fill="#afd7ff" textLength="42.1" lengthAdjust="spacingAndGlyphs">total</text>
<text x="447.9" y="257" fill="#d7dae0" textLength="345.6" lengthAdjust="spacingAndGlyphs">, which adds up an array of numbers with </text>
<text x="793.6" y="257" fill="#afd7ff" textLength="50.6" lengthAdjust="spacingAndGlyphs">reduce</text>
<text x="844.1" y="257" fill="#d7dae0" textLength="286.6" lengthAdjust="spacingAndGlyphs"> and returns 0 for an empty array.</text>
<text x="18.0" y="295" fill="#949494" textLength="8.4" lengthAdjust="spacingAndGlyphs">✻</text>
<text x="34.9" y="295" fill="#949494" textLength="236.0" lengthAdjust="spacingAndGlyphs">Brewed for 3s · done 2:00 PM</text>
<text x="18.0" y="333" fill="#d78787" textLength="109.6" lengthAdjust="spacingAndGlyphs">Opus 5.5 high</text>
<text x="127.6" y="333" fill="#949494" textLength="25.3" lengthAdjust="spacingAndGlyphs"> · </text>
<text x="152.9" y="333" fill="#d7dae0" textLength="84.3" lengthAdjust="spacingAndGlyphs">context 4%</text>
<text x="237.2" y="333" fill="#949494" textLength="25.3" lengthAdjust="spacingAndGlyphs"> · </text>
