<rect x="34.9" y="148.0" width="429.9" height="19" fill="#3a3a3a"/>
<text x="34.9" y="162" fill="#ffffff" textLength="429.9" lengthAdjust="spacingAndGlyphs">In one short sentence, what does a prompt cache do?</text>
<text x="18.0" y="200" fill="#ffffff" textLength="8.4" lengthAdjust="spacingAndGlyphs">⏺</text>
<text x="26.4" y="200" fill="#d7dae0" textLength="1112.8" lengthAdjust="spacingAndGlyphs"> A prompt cache stores the already-processed beginning of a prompt, such as the system prompt, tools and earlier conversation. Later</text>
<text x="18.0" y="219" fill="#d7dae0" textLength="977.9" lengthAdjust="spacingAndGlyphs">  requests that start with the same text reuse that work instead of computing it again, which cuts latency and cost.</text>
<text x="18.0" y="257" fill="#949494" textLength="8.4" lengthAdjust="spacingAndGlyphs">✻</text>
