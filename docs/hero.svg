<svg xmlns="http://www.w3.org/2000/svg" width="879" height="622" viewBox="0 0 879 622" role="img" aria-label="g-line: live status under the prompt, receipts on the turns">
<style>text{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;font-size:14px;white-space:pre}</style>
<rect width="100%" height="100%" rx="10" fill="#16181d"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="440" y="22" fill="#8a8f98" text-anchor="middle">g-line: live status under the prompt, receipts on the turns</text>
<text x="18.0" y="86" fill="#ffffff" textLength="8.4" lengthAdjust="spacingAndGlyphs">⏺</text>
<text x="26.4" y="86" fill="#d7dae0" textLength="438.4" lengthAdjust="spacingAndGlyphs"> I found 7 breaking changes for clients between v1 (</text>
<text x="464.8" y="86" fill="#afd7ff" textLength="42.1" lengthAdjust="spacingAndGlyphs">1.8.0</text>
<text x="506.9" y="86" fill="#d7dae0" textLength="84.3" lengthAdjust="spacingAndGlyphs">) and v2 (</text>
<text x="591.2" y="86" fill="#afd7ff" textLength="42.1" lengthAdjust="spacingAndGlyphs">2.0.0</text>
<text x="633.4" y="86" fill="#d7dae0" textLength="16.9" lengthAdjust="spacingAndGlyphs">):</text>
<text x="18.0" y="124" fill="#d7dae0" textLength="33.7" lengthAdjust="spacingAndGlyphs">  - </text>
<text x="51.7" y="124" fill="#afd7ff" font-weight="700" textLength="193.9" lengthAdjust="spacingAndGlyphs">DELETE /v1/coupons/{id}</text>
<text x="245.6" y="124" fill="#d7dae0" font-weight="700" textLength="75.9" lengthAdjust="spacingAndGlyphs"> removed:</text>
<text x="321.5" y="124" fill="#d7dae0" textLength="328.8" lengthAdjust="spacingAndGlyphs"> clients can no longer delete a coupon.</text>
<text x="18.0" y="143" fill="#d7dae0" textLength="33.7" lengthAdjust="spacingAndGlyphs">  - </text>
<text x="51.7" y="143" fill="#afd7ff" font-weight="700" textLength="151.7" lengthAdjust="spacingAndGlyphs">Order.amount_cents</text>
<text x="203.5" y="143" fill="#d7dae0" font-weight="700" textLength="269.8" lengthAdjust="spacingAndGlyphs"> changed from integer to string:</text>
<text x="473.2" y="143" fill="#d7dae0" textLength="370.9" lengthAdjust="spacingAndGlyphs"> this affects both responses and the request</text>
<text x="18.0" y="162" fill="#d7dae0" textLength="126.4" lengthAdjust="spacingAndGlyphs">    bodies for </text>
<text x="144.4" y="162" fill="#afd7ff" textLength="33.7" lengthAdjust="spacingAndGlyphs">POST</text>
<text x="178.2" y="162" fill="#d7dae0" textLength="8.4" lengthAdjust="spacingAndGlyphs">/</text>
<text x="186.6" y="162" fill="#afd7ff" textLength="134.9" lengthAdjust="spacingAndGlyphs">PATCH /v1/orders</text>
<text x="321.5" y="162" fill="#d7dae0" textLength="8.4" lengthAdjust="spacingAndGlyphs">.</text>
<text x="18.0" y="181" fill="#d7dae0" textLength="33.7" lengthAdjust="spacingAndGlyphs">  - </text>
<text x="51.7" y="181" fill="#afd7ff" font-weight="700" textLength="118.0" lengthAdjust="spacingAndGlyphs">Customer.email</text>
<text x="169.7" y="181" fill="#d7dae0" font-weight="700" textLength="219.2" lengthAdjust="spacingAndGlyphs"> is now a required string:</text>
<text x="397.3" y="181" fill="#afd7ff" textLength="33.7" lengthAdjust="spacingAndGlyphs">POST</text>
<text x="431.1" y="181" fill="#d7dae0" textLength="42.1" lengthAdjust="spacingAndGlyphs"> and </text>
<text x="473.2" y="181" fill="#afd7ff" textLength="160.2" lengthAdjust="spacingAndGlyphs">PATCH /v1/customers</text>
<text x="633.4" y="181" fill="#d7dae0" textLength="151.7" lengthAdjust="spacingAndGlyphs"> requests without </text>
<text x="785.1" y="181" fill="#afd7ff" textLength="42.1" lengthAdjust="spacingAndGlyphs">email</text>
<text x="18.0" y="200" fill="#d7dae0" textLength="438.4" lengthAdjust="spacingAndGlyphs">    will fail validation, because both use the same </text>
<text x="456.4" y="200" fill="#afd7ff" textLength="67.4" lengthAdjust="spacingAndGlyphs">Customer</text>
<text x="523.8" y="200" fill="#d7dae0" textLength="67.4" lengthAdjust="spacingAndGlyphs"> schema.</text>
<text x="18.0" y="219" fill="#d7dae0" textLength="33.7" lengthAdjust="spacingAndGlyphs">  - </text>
<text x="51.7" y="219" fill="#afd7ff" font-weight="700" textLength="75.9" lengthAdjust="spacingAndGlyphs">&quot;pending&quot;</text>
<text x="127.6" y="219" fill="#d7dae0" font-weight="700" textLength="118.0" lengthAdjust="spacingAndGlyphs"> removed from </text>
<text x="245.6" y="219" fill="#afd7ff" font-weight="700" textLength="118.0" lengthAdjust="spacingAndGlyphs">Payment.status</text>
<text x="363.6" y="219" fill="#d7dae0" font-weight="700" textLength="8.4" lengthAdjust="spacingAndGlyphs">:</text>
<text x="372.1" y="219" fill="#d7dae0" textLength="480.5" lengthAdjust="spacingAndGlyphs"> requests that send it will be rejected, and clients that</text>
<text x="18.0" y="238" fill="#d7dae0" textLength="295.1" lengthAdjust="spacingAndGlyphs">    check for it will never see it.</text>
<text x="18.0" y="257" fill="#d7dae0" textLength="33.7" lengthAdjust="spacingAndGlyphs">  - </text>
<text x="51.7" y="257" fill="#afd7ff" font-weight="700" textLength="118.0" lengthAdjust="spacingAndGlyphs">Shipment.notes</text>
<text x="169.7" y="257" fill="#d7dae0" font-weight="700" textLength="75.9" lengthAdjust="spacingAndGlyphs"> removed:</text>
<text x="245.6" y="257" fill="#d7dae0" textLength="472.1" lengthAdjust="spacingAndGlyphs"> the field is gone from shipment requests and responses.</text>
<text x="18.0" y="276" fill="#d7dae0" textLength="33.7" lengthAdjust="spacingAndGlyphs">  - </text>
<text x="51.7" y="276" fill="#afd7ff" font-weight="700" textLength="134.9" lengthAdjust="spacingAndGlyphs">GET /v1/products</text>
<text x="186.6" y="276" fill="#d7dae0" font-weight="700" textLength="143.3" lengthAdjust="spacingAndGlyphs"> query parameter </text>
<text x="329.9" y="276" fill="#afd7ff" font-weight="700" textLength="50.6" lengthAdjust="spacingAndGlyphs">cursor</text>
<text x="380.5" y="276" fill="#d7dae0" font-weight="700" textLength="101.2" lengthAdjust="spacingAndGlyphs"> renamed to </text>
<text x="481.6" y="276" fill="#afd7ff" font-weight="700" textLength="84.3" lengthAdjust="spacingAndGlyphs">page_token</text>
<text x="565.9" y="276" fill="#d7dae0" font-weight="700" textLength="8.4" lengthAdjust="spacingAndGlyphs">:</text>
<text x="574.4" y="276" fill="#d7dae0" textLength="210.8" lengthAdjust="spacingAndGlyphs"> clients that still send </text>
<text x="785.1" y="276" fill="#afd7ff" textLength="50.6" lengthAdjust="spacingAndGlyphs">cursor</text>
<text x="18.0" y="295" fill="#d7dae0" textLength="328.8" lengthAdjust="spacingAndGlyphs">    will page wrong or have it ignored.</text>
<text x="18.0" y="314" fill="#d7dae0" textLength="33.7" lengthAdjust="spacingAndGlyphs">  - </text>
<text x="51.7" y="314" fill="#afd7ff" font-weight="700" textLength="126.4" lengthAdjust="spacingAndGlyphs">GET /v1/refunds</text>
<text x="186.6" y="314" fill="#afd7ff" font-weight="700" textLength="42.1" lengthAdjust="spacingAndGlyphs">limit</text>
<text x="228.8" y="314" fill="#d7dae0" font-weight="700" textLength="269.8" lengthAdjust="spacingAndGlyphs"> maximum lowered from 100 to 50:</text>
<text x="498.5" y="314" fill="#d7dae0" textLength="126.4" lengthAdjust="spacingAndGlyphs"> requests with </text>
<text x="625.0" y="314" fill="#afd7ff" textLength="42.1" lengthAdjust="spacingAndGlyphs">limit</text>
<text x="667.1" y="314" fill="#d7dae0" textLength="193.9" lengthAdjust="spacingAndGlyphs"> between 51 and 100 now</text>
<text x="18.0" y="333" fill="#d7dae0" textLength="219.2" lengthAdjust="spacingAndGlyphs">    fall outside the spec.</text>
<text x="18.0" y="371" fill="#d7dae0" textLength="278.2" lengthAdjust="spacingAndGlyphs">  Not breaking: the new optional </text>
<text x="296.2" y="371" fill="#afd7ff" textLength="109.6" lengthAdjust="spacingAndGlyphs">Review.rating</text>
<text x="405.8" y="371" fill="#d7dae0" textLength="328.8" lengthAdjust="spacingAndGlyphs"> field (an integer from 1 to 5, not in </text>
<text x="734.5" y="371" fill="#afd7ff" textLength="67.4" lengthAdjust="spacingAndGlyphs">required</text>
<text x="802.0" y="371" fill="#d7dae0" textLength="42.1" lengthAdjust="spacingAndGlyphs">) and</text>
<text x="18.0" y="390" fill="#d7dae0" textLength="160.2" lengthAdjust="spacingAndGlyphs">  the version bump.</text>
<text x="18.0" y="428" fill="#d7dae0" textLength="244.5" lengthAdjust="spacingAndGlyphs">  All paths still start with </text>
<text x="262.5" y="428" fill="#afd7ff" textLength="33.7" lengthAdjust="spacingAndGlyphs">/v1/</text>
<text x="296.2" y="428" fill="#d7dae0" textLength="244.5" lengthAdjust="spacingAndGlyphs"> even though the spec is now </text>
<text x="540.7" y="428" fill="#afd7ff" textLength="42.1" lengthAdjust="spacingAndGlyphs">2.0.0</text>
<text x="582.8" y="428" fill="#d7dae0" textLength="227.6" lengthAdjust="spacingAndGlyphs">, so clients can&#x27;t tell the</text>
<text x="18.0" y="447" fill="#d7dae0" textLength="202.3" lengthAdjust="spacingAndGlyphs">  versions apart by URL.</text>
<text x="18.0" y="485" fill="#949494" textLength="8.4" lengthAdjust="spacingAndGlyphs">✻</text>
<text x="34.9" y="485" fill="#949494" textLength="261.3" lengthAdjust="spacingAndGlyphs">Baked for 43s · done 1:22 PM · </text>
<text x="296.2" y="485" fill="#ffd700" font-weight="700" textLength="202.3" lengthAdjust="spacingAndGlyphs">cache cold · rebuilt 42k</text>
<text x="498.5" y="485" fill="#949494" textLength="101.2" lengthAdjust="spacingAndGlyphs"> · API $0.31</text>
<text x="18.0" y="523" fill="#808080" textLength="843.0" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="18.0" y="542" fill="#d7dae0" textLength="16.9" lengthAdjust="spacingAndGlyphs">❯ </text>
<text x="18.0" y="561" fill="#808080" textLength="843.0" lengthAdjust="spacingAndGlyphs">────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="34.9" y="580" fill="#949494" textLength="514.2" lengthAdjust="spacingAndGlyphs">⏸ manual mode on · ? for shortcuts · ctx 4% · 5h 1% · wk 80%!</text>
<text x="34.9" y="599" fill="#d78787" textLength="109.6" lengthAdjust="spacingAndGlyphs">Opus 5.5 high</text>
<text x="144.4" y="599" fill="#949494" textLength="25.3" lengthAdjust="spacingAndGlyphs"> · </text>
<text x="169.7" y="599" fill="#87d787" textLength="118.0" lengthAdjust="spacingAndGlyphs">cache warm ~4m</text>
<text x="287.8" y="599" fill="#949494" textLength="210.8" lengthAdjust="spacingAndGlyphs"> · 5h resets in 2h 47m · </text>
<text x="498.5" y="599" fill="#ffd700" textLength="295.1" lengthAdjust="spacingAndGlyphs">wk out ~Thu 19:00, resets Fri 16:00</text>
</svg>
